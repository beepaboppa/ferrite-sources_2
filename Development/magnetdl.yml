  - name: MagnetDL
    version: 1
    minVersion: '0.7.1'
    about: >-
      Large source of various forms of media.
    website: "https://magnetdl.com"
    tags:
      - name: Movies
      - name: TV
      - name: Anime
    htmlParser:
      searchUrl: /n/{query}
      rows: .fill-table table tbody tr
      magnet:
        query: .m a
        attribute: href
      title:
        query: .n
      size:
        query: td:nth-child(6)
      sl:
        seeders: .s
        leechers: .l