name: ferr YAML plugins
author: ferr kingbri
sources:
  - name: EXT.to
    version: 1
    minVersion: '0.7.2'
    about: >-
      A clone of the classic ExtraTorrent site. For movies, TV, music, anime, and more. (Note: Unstable clone in 2025 - often low or no search results; use at own risk)
    website: https://ext.to
    tags:
      - name: Reliable
        color: 34c759
      - name: Movies
      - name: TV
      - name: Anime
    htmlParser:
      searchUrl: /search/?search={query}&srt=seeds&order=desc
      rows: tr.tlr
      magnet:
        query: td:nth-child(1) > a:nth-child(2)
        attribute: href
      title:
        query: td:nth-child(3) > a
      size:
        query: td:nth-child(5)
      sl:
        seeders: td:nth-child(6)
        leechers: td:nth-child(7)
