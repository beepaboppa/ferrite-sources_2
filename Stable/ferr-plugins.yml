name: ferr YAML plugins
author: ferr kingbri
sources:
  - name: EXT.to
    version: 1
    minVersion: '0.7.2'
    about: >-
      A clone of the classic ExtraTorrent site. Reliable for movies, TV, music, and more.
    website: https://ext.to
    tags:
      - name: Reliable
        color: 34c759
      - name: Movies
      - name: TV
      - name: Anime
    fallbackUrls:
      - https://ext.to
      - https://extratorrent.si
      - https://extratorrent.st
      - https://extratorrent.one
      - https://extratorrent.cc
    htmlParser:  # <-- Fixed: lowercase 'p' to match official sources
      searchUrl: /search/?search={query}&srt=seeds&order=desc
      rows: tr.tlr
      magnet:
        query: td:nth-child(1) > a:nth-child(2)
        attribute: href
      title:
        query: td:nth-child(3) > a
      size:
        query: td:nth-child(5)
      sl:
        seeders: td:nth-child(6)
        leechers: td:nth-child(7)
